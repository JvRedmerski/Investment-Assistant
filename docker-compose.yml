services:
  postgres:
    image: postgres:16-alpine
    container_name: investment_assistant_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investment_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-investment_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investment_pass_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-investment_user} -d ${POSTGRES_DB:-investment_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: investment_assistant_backend
    restart: always
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-investment_user}:${POSTGRES_PASSWORD:-investment_pass_dev}@postgres:5432/${POSTGRES_DB:-investment_assistant}
      - APP_ENV=${APP_ENV:-development}
      - SECRET_KEY=${SECRET_KEY}
      - AI_PROVIDER=${AI_PROVIDER}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER}
      - BRAPI_TOKEN=${BRAPI_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: investment_assistant_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
